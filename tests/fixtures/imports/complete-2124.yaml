mode: rule
mixed-port: 7890
allow-lan: false
dns: {enable: true, enhanced-mode: fake-ip, nameserver: [https://dns.example.invalid/dns-query]}
proxies:
  - {name: Gateway, type: ss, server: gateway.example.invalid, port: 443, cipher: aes-128-gcm, password: fixture-gateway}
  - {name: Leaf, type: ss, server: leaf.example.invalid, port: 443, cipher: aes-128-gcm, password: fixture-leaf, dialer-proxy: Gateway}
  - {name: Reality, type: vless, server: vless.example.invalid, port: 443, uuid: 00000000-0000-4000-8000-000000000001, tls: true, network: ws, ws-opts: {path: /fixture}, reality-opts: {public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA, short-id: '0123456789abcdef'}}
  - {name: Hy2, type: hysteria2, server: hy2.example.invalid, port: 443, password: fixture-hy2, up: '30 Mbps', down: '200 Mbps'}
  - {name: Tuic, type: tuic, server: tuic.example.invalid, port: 443, uuid: 00000000-0000-4000-8000-000000000002, password: fixture-tuic, congestion-controller: bbr}
