spring:
  application:
    name: clash-subscription-manager
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clashsub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:clashsub}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8080}
  tomcat:
    accesslog:
      enabled: false
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
clash:
  node-regions-file: ${NODE_REGIONS_FILE:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  fetch:
    private-allowlist: ${UPSTREAM_PRIVATE_ALLOWLIST:}
    trusted-proxy-url: ${TRUSTED_OUTBOUND_PROXY_URL:}
  encryption-key-file: ${APP_ENCRYPTION_KEY_FILE:}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password-file: ${ADMIN_PASSWORD_FILE:}
